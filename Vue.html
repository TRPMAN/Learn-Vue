<!DOCTYPE html>
<html>

  <head>
    <title>My first Vue page</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
      body{
        background: #eee;
        max-width: 960px;
        margin: 20px auto;
      }
      p, h3, ul{
        margin: 0;
        padding: 0;
      }
      li{
        list-style-type: none;
        background: #fff;
        margin: 20px auto;
        padding: 10px 20px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content:space-between;
      }
      li.fav{
        background: #ff0000;
        color: white;
      }
      img{
        width: 30%;
      }
    </style>
  </head>

  <body>
    <h1>Hello</h1>

    <div id="app">  

      <!-- <a :href="urls">best web</a> -->

      <div v-if ="showBooks"> 
        <ul>
          <li v-for="book in books" :class="{ fav: book.isFav}" v-on:click="handlefav(book)" >
            <img :src="book.img" :alt="book.title">
            <h3>{{book.title}}</h3>
            <p>{{book.author}}</p>
          </li>
        </ul>  
      </div>

      <div v-else>
          <p>Click the button below to show books</p>
      </div>

      <button @click="toggleShowBooks">
        <span v-if="showBooks">Hide Books</span>
        <span v-else>Show Books</span>
      </button>
 
    </div>

    <script src="app.js"></script>

  </body>

</html>
